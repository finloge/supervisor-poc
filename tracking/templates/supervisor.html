<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Supervisor Dashboard - Zone Assignment</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .layout {
        display: flex;
        height: 100vh;
      }
      /* Sidebar */
      #sidebar {
        width: 280px;
        border-left: 1px solid #ddd;
        padding: 10px;
        overflow-y: auto;
        background: #f9f9f9;
      }
      .inspector-card {
        display: flex;
        flex-direction: column;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 8px;
        margin-bottom: 8px;
        background: white;
        cursor: pointer;
      }
      .inspector-card.active {
        background: #eef2ff;
        border: 2px solid #4f46e5;
      }
      .inspector-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .inspector-info {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
      }
      .status {
        font-size: 12px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .assigned {
        background: #e6ffed;
        color: #1a7f37;
        border: 1px solid #1a7f37;
      }
      .unassigned {
        background: #ffeaea;
        color: #b91c1c;
        border: 1px solid #b91c1c;
      }
      .zone-name {
        font-size: 13px;
        color: #374151;
        background: #f3f4f6;
        border-radius: 6px;
        padding: 3px 6px;
        margin-top: 6px;
        text-align: center;
      }
      #map {
        flex: 1;
      }
    </style>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBsVTuXH5BE2bNMenRRpdR-O2RAVz13dTE"></script>
  </head>

  <body>
    <div class="layout">
      <div id="map"></div>
      <div id="sidebar">
        <h3>Inspectors</h3>
        <div id="inspector-list"></div>
      </div>
    </div>

    <script>
      let map, infoWindow;
      let markers = {};
      let circles = {};
      let zones = {};
      let zoneData = {};
      let activeInspector = null;
      let zoneAssignments = {};

      async function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 25.2532, lng: 55.3657 },
          zoom: 16,
          mapTypeId: google.maps.MapTypeId.SATELLITE,
        });
        infoWindow = new google.maps.InfoWindow();

        await loadZones();
        await loadZoneAssignments();
        await loadInspectors();
      }

      /** Fetch current zone assignments */
      async function loadZoneAssignments() {
        const res = await fetch("/api/zone-assignments/");
        zoneAssignments = await res.json();
      }

      /** Load inspectors into sidebar */
      async function loadInspectors() {
        const res = await fetch("/api/inspections/");
        const data = await res.json();
        const list = document.getElementById("inspector-list");
        list.innerHTML = "";

        for (const [id, ins] of Object.entries(data)) {
          const assignedZone = zoneAssignments[id] || null;
          const card = document.createElement("div");
          card.className = "inspector-card";
          card.dataset.id = id;
          card.innerHTML = `
            <div class="inspector-header">
              <div class="inspector-info">
                <div class="avatar" style="background-image:url('https://i.pravatar.cc/150?u=${id}')"></div>
                <div>
                  <div><strong>${ins.title}</strong></div>
                  <small>ID: ${id}</small>
                </div>
              </div>
              <span class="status ${ins.lat ? "assigned" : "unassigned"}">
                ${ins.lat ? "Assigned" : "Unassigned"}
              </span>
            </div>
            <div class="zone-name">
              ${assignedZone ? "📍 " + assignedZone : "— No Zone Assigned —"}
            </div>
          `;

          card.onclick = () =>
            selectInspector(
              id,
              ins.title,
              `https://i.pravatar.cc/150?u=${id}`,
              ins.radius || 100,
              card
            );
          list.appendChild(card);

          // Place assigned marker if inspector has location
          if (ins.lat && ins.lng) {
            upsertMarker(
              id,
              ins.title,
              ins.lat,
              ins.lng,
              `https://i.pravatar.cc/150?u=${id}`,
              ins.radius || 100
            );
          }
        }
      }

      /** Load all zones and make clickable */
      async function loadZones() {
        const res = await fetch("/api/zones/");
        zoneData = await res.json();

        for (const [id, zone] of Object.entries(zoneData)) {
          const polygon = new google.maps.Polygon({
            paths: zone.coordinates,
            strokeColor: "#4f46e5",
            strokeOpacity: 0.9,
            strokeWeight: 2,
            fillColor: "#818cf8",
            fillOpacity: 0.15,
            map,
          });

          zones[id] = polygon;

          polygon.addListener("click", async (e) => {
            if (activeInspector) {
              const center = getPolygonCenter(zone.coordinates);
              await assignInspectorToZone(
                activeInspector.id,
                id,
                center.lat,
                center.lng
              );
              clearActive();
              highlightZone(polygon, "#22c55e");
              await loadZoneAssignments();
              await loadInspectors();
            } else {
              infoWindow.setContent(`<b>${zone.name}</b>`);
              infoWindow.setPosition(e.latLng);
              infoWindow.open(map);
            }
          });

          polygon.addListener("mouseover", () =>
            polygon.setOptions({ fillColor: "#a5b4fc" })
          );
          polygon.addListener("mouseout", () =>
            polygon.setOptions({ fillColor: "#818cf8" })
          );
        }
      }

      function selectInspector(id, name, avatar, radius, cardEl) {
        document
          .querySelectorAll(".inspector-card")
          .forEach((c) => c.classList.remove("active"));
        cardEl.classList.add("active");
        activeInspector = { id, name, avatar, radius };
      }

      function clearActive() {
        activeInspector = null;
        document
          .querySelectorAll(".inspector-card")
          .forEach((c) => c.classList.remove("active"));
      }

      async function assignInspectorToZone(inspectorId, zoneId, lat, lng) {
        try {
          await fetch("/api/zone-assign/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              zone_id: zoneId,
              inspector_id: inspectorId,
            }),
          });

          await fetch("/api/inspection-update/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              inspection_id: inspectorId,
              latitude: lat,
              longitude: lng,
              radius: 100,
            }),
          });

          upsertMarker(
            inspectorId,
            "Inspector",
            lat,
            lng,
            `https://i.pravatar.cc/150?u=${inspectorId}`,
            100
          );
          alert("✅ Inspector assigned to zone successfully!");
        } catch (err) {
          console.error(err);
          alert("❌ Error assigning inspector.");
        }
      }

      function upsertMarker(id, name, lat, lng, avatar, radius) {
        if (!markers[id]) {
          const m = new google.maps.Marker({
            position: { lat, lng },
            map,
            draggable: true,
            icon: {
              url: `https://i.pravatar.cc/40?u=${id}`,
              scaledSize: new google.maps.Size(40, 40),
            },
          });
          m.addListener("dragend", (e) => {
            saveAndPlace(
              id,
              name,
              e.latLng.lat(),
              e.latLng.lng(),
              avatar,
              radius
            );
          });
          markers[id] = m;
        } else {
          markers[id].setPosition({ lat, lng });
        }

        if (circles[id]) circles[id].setMap(null);
        circles[id] = new google.maps.Circle({
          strokeColor: "#4f46e5",
          strokeOpacity: 0.8,
          strokeWeight: 2,
          fillColor: "#6366f1",
          fillOpacity: 0.1,
          map,
          center: { lat, lng },
          radius,
        });
      }

      async function saveAndPlace(id, name, lat, lng, avatar, radius) {
        await fetch("/api/inspection-update/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            inspection_id: id,
            latitude: lat,
            longitude: lng,
            radius,
          }),
        });
        upsertMarker(id, name, lat, lng, avatar, radius);
      }

      function getPolygonCenter(coords) {
        let latSum = 0,
          lngSum = 0;
        coords.forEach((c) => {
          latSum += c.lat;
          lngSum += c.lng;
        });
        return {
          lat: latSum / coords.length,
          lng: lngSum / coords.length,
        };
      }

      function highlightZone(zone, color) {
        zone.setOptions({ fillColor: color, fillOpacity: 0.25 });
      }

      window.onload = initMap;
    </script>
  </body>
</html>
